name: Publish

# Publishing is tag-driven: pushing v0.1.0 publishes version 0.1.0. The job refuses
# to publish when the tag and package.json disagree, so the registry can never end up
# with a version that does not match the commit it came from.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for npm provenance, which lets consumers verify that this tarball
      # was built from this repository by this workflow.
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Check tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "Tag v$tag does not match package.json version $pkg" >&2
            exit 1
          fi
          echo "Tag v$tag matches package.json."

      - name: Guard against publishing placeholders
        run: |
          if grep -rn "REPLACE_WITH" package.json LICENSE; then
            echo "Placeholders remain in package.json or LICENSE; refusing to publish." >&2
            exit 1
          fi

      - name: Publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
