name: Publish

# Manual only, on purpose.
#
# This workflow used to fire on any `v*` tag. That conflicts with publishing by hand:
# pushing a tag would start a second publish attempt that fails for want of an
# NPM_TOKEN secret, leaving a red run on the repo. Releasing is a deliberate act, so
# it is triggered deliberately.
#
# To make tags publish automatically later, configure npm trusted publishing (OIDC)
# for this repository and workflow at
# https://www.npmjs.com/package/pi-usage-live/access, then add back:
#
#   on:
#     push:
#       tags: ["v*"]
#
# With OIDC there is no token to store, and `--provenance` becomes verifiable.
on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for npm provenance, which lets consumers verify that this tarball
      # was built from this repository by this workflow.
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Check the version is not already published
        run: |
          pkg="$(node -p "require('./package.json').version")"
          if npm view "pi-usage-live@$pkg" version >/dev/null 2>&1; then
            echo "pi-usage-live@$pkg is already published; bump the version first." >&2
            exit 1
          fi
          echo "pi-usage-live@$pkg is not yet published."

      - name: Guard against publishing placeholders
        run: |
          if grep -rn "REPLACE_WITH" package.json LICENSE; then
            echo "Placeholders remain in package.json or LICENSE; refusing to publish." >&2
            exit 1
          fi

      - name: Publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
