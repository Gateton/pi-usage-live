name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref: a queued run for an older commit tells
# you nothing once a newer one exists.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # The minimum supported version, which is also what the test runner's
          # TypeScript flags are exercised against.
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
